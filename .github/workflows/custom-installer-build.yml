name: Custom installer builds

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      use-sccache:
        description: "Use sccache"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  buildid:
    name: Generate build ID
    runs-on: ubuntu-latest
    outputs:
      buildids: ${{ steps.get.outputs.bid }}
    steps:
      - id: get
        shell: bash
        run: echo "bid=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  build-data:
    name: Read build data
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.data.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Twilight version
        id: data
        shell: bash
        run: |
          version="$(node -pe "require('./surfer.json').brands.twilight.release.displayVersion")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer and update package
    uses: ./.github/workflows/windows-release-build.yml
    needs: [build-data, buildid]
    permissions:
      contents: read
    secrets: inherit
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      generate-pgo: false
      disable-pgo: true
      release-branch: twilight
      MOZ_BUILD_DATE: ${{ needs.buildid.outputs.buildids }}
      use-sccache: ${{ inputs.use-sccache || false }}

  macos:
    name: macOS DMG packages
    uses: ./.github/workflows/macos-release-build.yml
    needs: [build-data, buildid]
    permissions:
      contents: read
    secrets: inherit
    with:
      build-version: ${{ needs.build-data.outputs.version }}
      generate-pgo: false
      disable-pgo: true
      release-branch: twilight
      MOZ_BUILD_DATE: ${{ needs.buildid.outputs.buildids }}
      use-sccache: ${{ inputs.use-sccache || false }}

  publish-macos:
    name: Publish permanent macOS downloads
    needs: [build-data, buildid, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: zen-*-apple-darwin-dist.dmg
          path: dist
          merge-multiple: true

      - name: Verify both macOS architectures
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/zen-x86_64-apple-darwin-dist.dmg
          test -s dist/zen-aarch64-apple-darwin-dist.dmg

      - name: Publish DMGs to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ needs.buildid.outputs.buildids }}
          BUILD_VERSION: ${{ needs.build-data.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "custom-macos-${BUILD_ID}" \
            dist/zen-x86_64-apple-darwin-dist.dmg \
            dist/zen-aarch64-apple-darwin-dist.dmg \
            --target "$GITHUB_SHA" \
            --title "Zen Twilight ${BUILD_VERSION} macOS (${BUILD_ID})" \
            --notes "macOS Intel and Apple Silicon DMGs built from ${GITHUB_SHA}." \
            --prerelease
